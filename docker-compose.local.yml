services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rtattooai-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - rtattooai-sqlserver-data:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: rtattooai-azurite
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --location /data --debug /data/debug.log"
    ports:
      - "10000:10000"
    volumes:
      - rtattooai-azurite-data:/data

volumes:
  rtattooai-sqlserver-data:
  rtattooai-azurite-data:
